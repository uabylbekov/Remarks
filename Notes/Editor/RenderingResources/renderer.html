<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:; connect-src 'none';">
<link rel="stylesheet" href="katex.min.css">
<style>
html,body{margin:0;padding:0;background:transparent}
#preview{display:inline-block;box-sizing:border-box;padding:6px 2px;max-width:100%;overflow:hidden}
.katex-display{margin:0}
svg{max-width:100%;height:auto;display:block}
svg text{font-weight:400;letter-spacing:0}
svg .node rect,svg .node polygon,svg .node circle,svg .cluster rect{stroke-width:1}
svg .flowchart-link{stroke-width:1.25}
svg .edgeLabel{font-size:0.85em}
</style>
<div id="preview"></div>
<script src="katex.min.js"></script>
<script src="mermaid.min.js"></script>
<script>
window.renderPreview = async function(source,kind,width,fontSize,dark) {
    const target = document.getElementById('preview');
    target.replaceChildren();
    document.body.style.width = width + 'px';
    target.style.maxWidth = '100%';
    target.style.fontSize = fontSize + 'px';
    target.style.color = dark ? '#eeeeee' : '#202020';
    if (kind === 'mermaid') {
        // User configuration may weaken security or trigger remote icon/image loading.
        if (/%%\{|^\s*---|https?:|data:|<\s*(?:img|iframe|script)/im.test(source)) throw Error('Unsupported diagram configuration');
        mermaid.initialize({startOnLoad:false, securityLevel:'strict',
            theme:'base', look:'classic', maxTextSize:20000, maxEdges:200,
            fontFamily:'-apple-system, BlinkMacSystemFont, sans-serif',
            themeVariables:{
                darkMode:dark,
                fontFamily:'-apple-system, BlinkMacSystemFont, sans-serif',
                fontSize:fontSize+'px',
                background:dark?'#1c1c1e':'#ffffff',
                primaryColor:dark?'#2c2c2e':'#f5f5f7',
                secondaryColor:dark?'#363638':'#ededf0',
                tertiaryColor:dark?'#242426':'#fafafa',
                primaryTextColor:dark?'#f2f2f7':'#1d1d1f',
                secondaryTextColor:dark?'#f2f2f7':'#1d1d1f',
                tertiaryTextColor:dark?'#f2f2f7':'#1d1d1f',
                textColor:dark?'#f2f2f7':'#1d1d1f',
                primaryBorderColor:dark?'#636366':'#aeaeb2',
                secondaryBorderColor:dark?'#636366':'#aeaeb2',
                tertiaryBorderColor:dark?'#48484a':'#c7c7cc',
                lineColor:dark?'#98989d':'#6e6e73',
                edgeLabelBackground:dark?'#1c1c1e':'#ffffff',
                clusterBkg:dark?'#242426':'#fafafa',
                clusterBorder:dark?'#48484a':'#d1d1d6',
                actorBkg:dark?'#2c2c2e':'#f5f5f7',
                actorBorder:dark?'#636366':'#aeaeb2',
                actorTextColor:dark?'#f2f2f7':'#1d1d1f',
                actorLineColor:dark?'#636366':'#aeaeb2',
                signalColor:dark?'#98989d':'#6e6e73',
                signalTextColor:dark?'#f2f2f7':'#1d1d1f',
                noteBkgColor:dark?'#363638':'#f5f5f7',
                noteBorderColor:dark?'#636366':'#aeaeb2',
                noteTextColor:dark?'#f2f2f7':'#1d1d1f'
            },
            flowchart:{htmlLabels:false,curve:'monotoneX',nodeSpacing:32,rankSpacing:48,padding:14},
            sequence:{mirrorActors:false,useMaxWidth:true}});
        const result = await mermaid.render('diagram', source);
        target.innerHTML = result.svg;
        // Soften rectangular nodes while preserving semantic shapes such as decisions and endpoints.
        target.querySelectorAll('.node rect').forEach(rect => {
            if (!Number(rect.getAttribute('rx'))) {
                rect.setAttribute('rx', '8');
                rect.setAttribute('ry', '8');
            }
        });
    } else {
        katex.render(source, target, {displayMode:kind==='displayMath',
            throwOnError:true, trust:false, strict:'error', maxExpand:1000, maxSize:20,
            output:'html'});
    }
    await document.fonts.ready;
    await new Promise(resolve=>setTimeout(resolve, 30));
    if (kind !== 'mermaid') {
        target.style.maxWidth = 'none';
        const natural = target.getBoundingClientRect().width;
        if (natural > width) target.style.fontSize = (fontSize * (width - 4) / (natural - 4)) + 'px';
    }
    let baselineMarker;
    if (kind === 'inlineMath') {
        baselineMarker = document.createElement('span');
        baselineMarker.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
        target.appendChild(baselineMarker);
    }
    const rect=target.getBoundingClientRect();
    const height=Math.ceil(rect.height);
    const baseline=baselineMarker ? baselineMarker.getBoundingClientRect().top-rect.top : height;
    return {width:Math.min(width,Math.ceil(rect.width)),height:height,baseline:baseline};
};
</script>
